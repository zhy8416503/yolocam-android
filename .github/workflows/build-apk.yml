name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 转换模型 (YOLO26n/x -> TFLite)
        run: |
          pip install "torch==2.13.0" "torchvision==0.28.0" --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics
          python -c "
          from ultralytics import YOLO
          import os, shutil
          for name in ['yolo26n', 'yolo26x']:
              print(f'导出 {name}...')
              model = YOLO(f'{name}.pt')
              out = model.export(format='tflite', imgsz=640)
              if os.path.isdir(out):
                  for f in os.listdir(out):
                      if f.endswith('.tflite'):
                          out = os.path.join(out, f)
                          break
              dst = f'app/src/main/assets/{name}.tflite'
              shutil.copy(out, dst)
              print(f'{name} 完成, 大小: {os.path.getsize(dst)/1024/1024:.1f} MB')
          "

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: YOLOCam-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YOLOCam Android YOLO26 v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
